# FOMO300 pretrain -- FAITHFUL to the original Neuro-JEPA recipe (geometry matched).
#
# Goal: reproduce pretrain_neurojepa_base.yaml as closely as the data allows.
# The optimization block is copied VERBATIM (num_epochs 200, warmup 40, ipe 1600,
# lr 5.25e-4, ema 0.99925, wd 0.04, grad_clip 1.0, betas, is_anneal false); the
# mask / model / loss blocks already matched. With the wds loader cycling shards,
# ipe 1600 x 200 epochs reproduces the original's exact 320k-step LR schedule.
#
# Geometry IS matched: the 208x240x208 FOMO300 shards are GPU-downsampled (in
# gpu_densify_batch, trilinear) to the original 96x108x96 / patch 12 -> 576
# tokens. data.source_img_size = shard geometry (used to unpack the bit-packed
# mask); model.img_size = post-downsample geometry that the model + masking +
# foreground grid (8x9x8) all see. This also lets us match the original
# batch_size 48 (576 tokens fit easily) -> effective batch 8*48=384.
#
# Remaining deviations (data, not tunable):
#   * data: ~153k single-modality (t1w-dominant) FOMO300 vs their ~1.55M
#     multi-modal (T1w+T2w+FLAIR). ipe 1600 over 153k => ~268 passes over 200
#     epochs (heavy repetition -- watch val for memorization).
#   * effective batch 384 (8x48) vs the original's (48 x their GPU count, larger);
#     close with more nodes / grad-accum if a probe says it matters.
#   * wds streaming + the engine's init NaN-grad sanitize+value-clip guard.
#
# PERF NOTE: at 576 tokens the model is ~4.4x cheaper per step, so this run is
# DATALOADER-BOUND (per-sample 208^3 unpack + downsample dominates) -> GPU util
# will sag below the full-res run's, though wall-clock is still far shorter. For
# sustained high util, pre-resample the shards to 96x108x96 offline (removes the
# 208^3 decode) and set data.source_img_size = model.img_size.
data:
  loader: "wds"
  dataset_type: "3D-MRI"
  train_url: /data/smri-datasets/FOMO300/shard.{000000..001020}.tar
  val_url: /data/smri-datasets/FOMO300/shard.{001021..001134}.tar   # held-out, viz only
  val_batch_size: 4
  train_csv_path: null
  cache_dir: null
  batch_size: 48            # original per-GPU batch; fits easily at 576 tokens
  gpu_densify: true
  source_img_size: [208, 240, 208]   # shard storage geometry (unpack here, then downsample)
  buffer_size: 1500
  prefetch_factor: 6
  image_dtype: float16
  img_size: [96, 108, 96]   # post-downsample (model) geometry; cosmetic in the wds path
  patch_size: [12, 12, 12]
  num_workers: 16
  pin_mem: true
  foreground_threshold: 0.0
  min_foreground_fraction: 0.1
data_aug:
  auto_augment: false
loss:
  loss_name: "l1"
  loss_exp: 1.0
  bg_weight: 0.1
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 32
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.0
  - 0.2
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 16
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.2
  - 0.5
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 4
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.5
  - 0.7
  depth_scale:
  - 0.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  load_path_checkpoint: runs/pretrain_fomo300_faithful/ckpt/latest.pt
  save_path_checkpoint: runs/pretrain_fomo300_faithful/ckpt
  read_checkpoint: null
  save_checkpoint_freq: 5
  seed: 42
  use_sdpa: true
  compile_model: true
model:
  model_name: "jepa"
  backbone_name: vit_base
  img_size: [96, 108, 96]   # matches the original Neuro-JEPA geometry
  patch_size: [12, 12, 12]
  in_chans: 1
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: false
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
  zero_init_mask_tokens: true
  foreground_aware: true
  use_moe: false
  moe_params:
    moe_type: "bias"
    dim: 768
    n_shared_experts: 2
    n_routed_experts: 16
    n_activated_experts: 6
    moe_inter_dim: 384
    score_func: softmax
    route_scale: 4.0
    bias_clip: 0.3
    bias_update_rate: 1e-4
    bias_update_rate_min: 1e-4
    bias_update_rate_max: 1e-4
    moe_layer_indices:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
optimization:
  # --- copied VERBATIM from pretrain_neurojepa_base.yaml ---
  is_anneal: False
  ema:
  - 0.99925
  - 0.99925
  num_epochs: 200
  final_lr: 0.000525
  final_weight_decay: 0.04
  ipe: 1600                 # original value; wds cycles shards to fill the epoch
  ipe_scale: 1.0
  lr: 0.000525
  start_lr: 0.0001
  warmup: 40
  weight_decay: 0.04
  grad_clip: 1.0
  mixed_precision: true
  betas:
  - 0.9
  - 0.999
  eps: 1e-08
log:
  filename: "pretrain_fomo300_faithful"
  log_freq: 1
  viz_freq: 250
  output_dir: runs/pretrain_fomo300_faithful
wandb:
  project: "fomo26"
  entity: "nimaashjaee-university-of-british-columbia"
  wandb_enable: true

hydra:
  run:
    dir: .
  job:
    chdir: false
