# Cooldown (LR-anneal) phase for the FOMO300 pretrain.
#
# Resumes the WEIGHTS from the 100-epoch checkpoint (load_checkpoint + is_anneal
# loads weights and resets the epoch/step counters) and anneals the LR
# 5.25e-4 -> 1e-6 over 20 epochs. This is the second half of the official
# Neuro-JEPA recipe (base = 200 main + 40 cooldown); the flat constant-LR
# plateau is the trigger to run it. Everything else matches the main config.
data:
  loader: "wds"
  dataset_type: "3D-MRI"
  train_url: /data/smri-datasets/FOMO300/shard.{000000..001020}.tar
  val_url: /data/smri-datasets/FOMO300/shard.{001021..001134}.tar
  val_batch_size: 4
  train_csv_path: null
  cache_dir: null
  batch_size: 16
  gpu_densify: true
  buffer_size: 1500
  prefetch_factor: 6
  image_dtype: float16
  img_size: [208, 240, 208]
  patch_size: [16, 16, 16]
  num_workers: 16
  pin_mem: true
  foreground_threshold: 0.0
  min_foreground_fraction: 0.1
data_aug:
  auto_augment: false
loss:
  loss_name: "l1"
  loss_exp: 1.0
  bg_weight: 0.1
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 32
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.0
  - 0.2
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 16
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.2
  - 0.5
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 4
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.5
  - 0.7
  depth_scale:
  - 0.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: true                                       # load weights from the main run
  load_path_checkpoint: runs/pretrain_fomo300/ckpt/latest.pt  # epoch-100 checkpoint
  save_path_checkpoint: runs/pretrain_fomo300/ckpt/cooldown
  read_checkpoint: null
  save_checkpoint_freq: 5
  seed: 239
  use_sdpa: true
  compile_model: true
model:
  model_name: "jepa"
  backbone_name: vit_base
  img_size: [208, 240, 208]
  patch_size: [16, 16, 16]
  in_chans: 1
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: false
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
  zero_init_mask_tokens: true
  foreground_aware: true
  use_moe: false
  moe_params:
    moe_type: "bias"
    dim: 768
    n_shared_experts: 2
    n_routed_experts: 16
    n_activated_experts: 6
    moe_inter_dim: 384
    score_func: softmax
    route_scale: 4.0
    bias_clip: 0.3
    bias_update_rate: 1e-4
    bias_update_rate_min: 1e-4
    bias_update_rate_max: 1e-4
    moe_layer_indices:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
optimization:
  is_anneal: true           # LinearDecaySchedule: lr -> final_lr
  ema:
  - 0.99925
  - 0.99925
  num_epochs: 20            # ~1/5 of the 100-epoch main (base used 40 for 200)
  final_lr: 1.0e-06
  final_weight_decay: 0.04
  ipe: 1195
  ipe_scale: 1.0
  lr: 0.000525
  start_lr: 0.0001
  warmup: 0
  weight_decay: 0.04
  grad_clip: 1.0
  mixed_precision: true
  betas:
  - 0.9
  - 0.999
  eps: 1e-08
log:
  filename: "pretrain_fomo300_cooldown"
  log_freq: 1
  viz_freq: 250
  output_dir: runs/pretrain_fomo300_cooldown
wandb:
  project: "fomo26"
  entity: "nimaashjaee-university-of-british-columbia"
  wandb_enable: true

hydra:
  run:
    dir: .
  job:
    chdir: false
