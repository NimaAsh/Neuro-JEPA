# FOMO300 pretrain -- FAITHFUL recipe, reading PRE-RESHARDED 96^3 shards.
#
# Identical recipe to pretrain_fomo300_faithful.yaml, but the data is already at
# the original 96x108x96 geometry (produced once by scripts/reshard_fomo300_96.py
# -> $FOMO300_96_DIR). So there is no on-the-fly densify of 208^3 + downsample and
# no 208^3 mask unpack: reads are ~5-6x smaller and the foreground grid is the
# cheap strided path. This makes the run GPU-BOUND (the on-the-fly variant was
# dataloader/IO-bound because the 96^3 model drains the 208^3 reads too fast).
#
# Set FOMO300_96_DIR to the dir you re-sharded into (the same one the reshard job
# wrote). Train/val shards keep the original basenames, so the 90/10 split holds.
#
# Recipe parity (verbatim): num_epochs 200, warmup 40, ipe 1600, lr 5.25e-4,
# ema 0.99925, wd 0.04, grad_clip 1.0, batch 48, 96x108x96 / patch 12 (576
# tokens). Remaining deviations are data-only (see the on-the-fly config header).
data:
  loader: "wds"
  dataset_type: "3D-MRI"
  train_url: ${oc.env:FOMO300_96_DIR}/shard.{000000..001020}.tar
  val_url: ${oc.env:FOMO300_96_DIR}/shard.{001021..001134}.tar   # held-out, viz only
  val_batch_size: 4
  train_csv_path: null
  cache_dir: null
  batch_size: 48
  gpu_densify: true
  # No source_img_size: shards are already 96^3, so source==target==model.img_size
  # (no downsample, cheap strided foreground).
  buffer_size: 1500
  prefetch_factor: 4    # deep enough (GPU-bound on 96^3); lower than 6 to ease shm churn
  image_dtype: float16
  img_size: [96, 108, 96]
  patch_size: [12, 12, 12]
  num_workers: 16
  pin_mem: true
  foreground_threshold: 0.0
  min_foreground_fraction: 0.1
data_aug:
  auto_augment: false
loss:
  loss_name: "l1"
  loss_exp: 1.0
  bg_weight: 0.1
mask:
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 32
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.0
  - 0.2
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 16
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.2
  - 0.5
  depth_scale:
  - 0.0
  - 1.0
- aspect_ratio:
  - 0.75
  - 1.5
  num_blocks: 4
  total_mask_ratio: 0.75
  spatial_scale:
  - 0.5
  - 0.7
  depth_scale:
  - 0.0
  - 1.0
meta:
  dtype: bfloat16
  eval_freq: 100
  load_checkpoint: false
  load_path_checkpoint: runs/pretrain_fomo300_faithful_pre96/ckpt/latest.pt
  save_path_checkpoint: runs/pretrain_fomo300_faithful_pre96/ckpt
  read_checkpoint: null
  save_checkpoint_freq: 5
  seed: 42
  use_sdpa: true
  compile_model: true
model:
  model_name: "jepa"
  backbone_name: vit_base
  img_size: [96, 108, 96]   # matches the original Neuro-JEPA geometry
  patch_size: [12, 12, 12]
  in_chans: 1
  pred_depth: 12
  pred_embed_dim: 384
  pred_num_heads: 12
  uniform_power: true
  use_activation_checkpointing: false
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  wide_silu: true
  zero_init_mask_tokens: true
  foreground_aware: true
  use_moe: false
  moe_params:
    moe_type: "bias"
    dim: 768
    n_shared_experts: 2
    n_routed_experts: 16
    n_activated_experts: 6
    moe_inter_dim: 384
    score_func: softmax
    route_scale: 4.0
    bias_clip: 0.3
    bias_update_rate: 1e-4
    bias_update_rate_min: 1e-4
    bias_update_rate_max: 1e-4
    moe_layer_indices:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
optimization:
  # --- copied VERBATIM from pretrain_neurojepa_base.yaml ---
  is_anneal: False
  ema:
  - 0.99925
  - 0.99925
  num_epochs: 200
  final_lr: 0.000525
  final_weight_decay: 0.04
  ipe: 1600
  ipe_scale: 1.0
  lr: 0.000525
  start_lr: 0.0001
  warmup: 40
  weight_decay: 0.04
  grad_clip: 1.0
  mixed_precision: true
  betas:
  - 0.9
  - 0.999
  eps: 1e-08
log:
  filename: "pretrain_fomo300_faithful_pre96"
  log_freq: 1
  viz_freq: 250
  output_dir: runs/pretrain_fomo300_faithful_pre96
wandb:
  project: "fomo26"
  entity: "nimaashjaee-university-of-british-columbia"
  wandb_enable: true

hydra:
  run:
    dir: .
  job:
    chdir: false
